name: familychat_app
description: Family Space — семейный мессенджер с родством.
publish_to: 'none'
version: 1.3.1+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gorila_chat:
    path: packages/gorila_chat
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  app_links: ^6.4.0
  url_launcher: ^6.3.1
  in_app_update: ^4.2.5
  package_info_plus: ^9.0.1
  flutter_rustore_update: ^10.5.0
  flutter_web_auth_2: ^4.1.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.3
  permission_handler: ^12.0.3
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  record: 6.1.0
  audioplayers: ^6.1.0
  vosk_flutter_service: ^0.1.1
  intl: ^0.20.2
  share_plus: ^12.0.2
  web_socket_channel: ^3.0.3
  image_picker: ^1.1.2
  photo_manager: ^3.6.4
  qr_flutter: ^4.1.0
  exif: ^3.3.0
  cached_network_image: ^3.4.1
  file_picker: ^8.1.7
  js: ^0.6.7
  emoji_picker_flutter: ^4.3.0
  share_handler: ^0.0.25
  flutter_cache_manager: ^3.4.1
  flutter_webrtc: ^1.5.2
  flutter_local_notifications: ^18.0.1
  flutter_ringtone_player: ^4.0.0+4
  video_player: ^2.9.5
  video_compress: ^3.1.4
  video_thumbnail: ^0.5.6
  visibility_detector: ^0.4.0+2
  flutter_staggered_grid_view: ^0.7.0
  camera: ^0.12.0+2
  flutter_image_compress: ^2.4.0
  drift: ^2.34.2
  path: ^1.9.1
  wakelock_plus: ^1.5.2
  real_page_flip:
    path: vendor/real_page_flip
  google_fonts: ^6.2.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.1
  native_dio_adapter: ^1.8.0

# sqlite3 3.x hooks download prebuilt .so from GitHub by default — that fails
# when github.com is unreachable. Compile vendored amalgamation instead.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c

dependency_overrides:
  # Upstream vosk_flutter_service has a web plugin manifest issue that makes
  # `flutter build web` fail during generated web_plugin_registrant.dart import.
  # We vendor a patched copy with corrected pubspec:web:fileName.
  vosk_flutter_service:
    path: vendor/vosk_flutter_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/logo/logo.png
    - assets/logo/google.png
    - assets/logo/vk.png
    - assets/logo/ya.png
    - assets/chat/birthday_celebration_avatar.jpg
    - assets/chat/family_chat_avatar.jpg
    - assets/chat/wallpapers/
    - assets/voice/vosk-model-small-ru-0.22.zip

# Генерация иконок: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/logo.png
  adaptive_icon_foreground_inset: 22
  web:
    generate: true
    image_path: assets/logo/logo.png
    background_color: "#FFFFFF"
    theme_color: "#7EC8F0"
